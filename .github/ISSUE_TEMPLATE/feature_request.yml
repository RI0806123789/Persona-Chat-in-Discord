name: 機能提案・改善要望
description: 解決したい課題と希望する動作を提案します。
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        既存のIssueを確認し、利用場面が伝わるように記載してください。
        APIキー・Discordトークン・個人情報・実際の会話ログは記載しないでください。
  - type: textarea
    id: problem
    attributes:
      label: 背景・解決したい課題
      description: どの場面で何に困っているか、現在の動作を含めて記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
      description: 利用者の操作と、その結果どうなるとよいかを具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 現在使っている回避策や、別の実現方法があれば記載してください。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 補足・影響範囲
      description: 対象の機能や環境、費用・依存関係・データの扱いへの影響などを記載してください。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 投稿前の確認
      options:
        - label: 同じ内容の既存Issueを確認しました。
          required: true
        - label: シークレット・個人情報を含めていません。
          required: true
        - label: "[行動規範](https://github.com/RI0806123789/Persona-Chat-in-Discord/blob/main/CODE_OF_CONDUCT.md) に従います。"
          required: true
